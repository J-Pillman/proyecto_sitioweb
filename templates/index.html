<!DOCTYPE html>
<html>
    <head lang="es">
        <title>Problema del flujo máximo</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico')}}">
        <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}?v=4">
    </head>
    <body>

        <div id="elegir-modo">
            <button id="btn-aleatorio">Generar Aleatorio</button>
            <button id="btn-manual">Manual</button>
        </div>

        <div id="modo-aleatorio" style="display:none">
            <label for="n">Numero de nodos (7-16):</label>
            <input type="number" id="n" min="7" max="16" value="7">
            <button id="generar">Generar Grafo</button>
            <button id="cancelar-aleatorio">Cancelar</button>
        </div>

        <!-- Cambio: organiza el modo manual por niveles centrados sin el botón Agregar Arista ni su Cancelar. -->
        <div id="modo-manual" style="display:none">
            <div class="nivel-manual">
                <button id="agregar-nodo">Agregar Nodo</button>
            </div>
            <div class="nivel-manual">
                <label for="arista-capacidad">Capacidad:</label>
                <input type="number" id="arista-capacidad" min="1" step="1" value="1" placeholder="Capacidad">
            </div>
            <div id="form-arista" class="nivel-manual">
                <button id="confirmar-arista">Elegir vértices</button>
                <span id="estado-arista">Indica la capacidad para empezar.</span>
            </div>
            <div class="nivel-manual">
                <button id="usar-red">Usar Red</button>
                <button id="cancelar-manual">Cancelar</button>
            </div>
            <div class="nivel-manual nivel-info">
                <p id="info-manual"></p>
                <small>Doble clic en un vértice para eliminarlo junto con sus aristas, o en una arista para eliminarla. Las terminales suplementarias se agregan automáticamente al usar la red.</small>
            </div>
        </div>

        <div id="grafo"></div>

        <div id="contenedor-algoritmo" style="display:none">
            <div id="acciones-algoritmo">
                <button id="ejecutar">Ejecutar Ford-Fulkerson</button>
                <button id="volver-edicion" style="background-color: #f59e0b; display: none;">Volver</button>
            </div>
    
            <div id="pasos-algoritmo" style="display:none">
                <h2>3. Ejecución paso a paso</h2>

                <div id="bloque-visor-pasos">
                    <div id="leyenda"></div>
                    <div id="grafo-pasos"></div>
                    <div id="navegacion">
                        <button id="anterior" disabled>← Anterior</button>
                        <span id="paso-info"></span>
                        <button id="siguiente" disabled>Siguiente →</button>
                        <button id="ir-final">Ir al final</button>
                        <button id="reiniciar">Reiniciar</button>
                    </div>
                </div>

                <div id="chips-container">
                    <label>Caminos encontrados (entre paréntesis, lo que se envía por cada uno)</label>
                    <div id="chips"></div>
                </div>

                <div id="progreso">
                    <label>Flujo total</label>
                    <div><b id="flujo-total-num">0</b> <span id="flujo-total-max"></span></div>
                    <div id="barra"><i id="barra-fill"></i></div>
                </div>
            </div>
        </div>

        <div id="resultado" style="display:none">
            <h2>4. Resultado</h2>
            <div id="resultado-contenido"></div>
        </div>

        <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
        <script src="{{url_for('static',filename='js/main.js')}}?v=4"></script>
    </body>
</html>
